# nginx.conf snippet for serving the split calculator
# Place inside your server {} block
#
# This strict CSP is possible because CSS/JS are separate files
location /calculator/ {
    root /var/www/html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
